name: Build Android Common Kernel

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

'on':
  workflow_dispatch:
    inputs:
      ack_branch:
        description: 'Android-common-kernel branch (e.g. common-android13-5.15)'
        required: true
        default: 'common-android13-5.15'
        type: string
      custom_kernel_repo:
        description: 'Custom kernel repository'
        required: true
        default: 'https://github.com/ChicKernel/device_xiaomi_gemstones-kernel'
        type: string
      custom_kernel_repo_branch:
        description: 'Custom kernel repository branch'
        required: true
        default: 'android13-5.15-lts'
        type: string
      use_latest_clang:
        description: 'Use the latest clang prebuilts (Check README!)'
        required: true
        default: true
        type: boolean
      anykernel_url_plus_branch:
        description: 'Space-separated AnyKernel3 fork URL + (Optional) Branch'
        required: true
        default: 'https://github.com/ChicKernel/AnyKernel3'
        type: string
      kernel_image_type:
        description: 'Kernel image to package (Image.gz, Image.lz4, etc)'
        required: true
        default: 'Image'
      fast_build:
        description: 'Instruct tools to perform a Fast Build'
        required: true
        default: true
        type: boolean
      use_kleaf:
        description: 'Use the kleaf build system instead of build script'
        required: true
        default: false
        type: boolean
      extra_args:
        description: 'Extra arguments that will be passed to build system/script'
        required: false
      build_configs:
        description: 'Space-separated list of build configurations'
        required: true
        default: 'build.config.gki.aarch64.chickernel'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_CONFIGS: ${{ github.event.inputs.build_configs }}
      IMAGE_TYPE: ${{ github.event.inputs.kernel_image_type }}

      ACK_BRANCH: ${{ github.event.inputs.ack_branch }}
      COMMON_REPO: ${{ github.event.inputs.custom_kernel_repo }}
      COMMON_REPO_BRANCH: ${{ github.event.inputs.custom_kernel_repo_branch }}
      AK3_GIT_URL_PLUS_BRANCH: ${{ github.event.inputs.anykernel_url_plus_branch }}

      AK3_DIR: ${{ github.workspace }}/kernel-build/anykernel3
      FINAL_DIR: ${{ github.workspace }}/kernel-build/final_images

    steps:
      - name: Validate inputs
        run: |
          AK3_GIT_URL=$(echo "${AK3_GIT_URL_PLUS_BRANCH}" | awk '{print $1}')
          AK3_GIT_BRANCH=$(echo "${AK3_GIT_URL_PLUS_BRANCH}" | awk '{print $2}')
          
          # Export these variables while we're at it
          echo "AK3_GIT_URL=${AK3_GIT_URL}" >> ${GITHUB_ENV}
          echo "AK3_GIT_BRANCH=${AK3_GIT_BRANCH}" >> ${GITHUB_ENV}

          validate_url() {
            if [[ ! "$1" =~ ^https://.+/.+/.+$ ]]; 
              then
                echo "Invalid URL: $1"
                echo "URL must be a valid HTTPS git repository URL"
                exit 1
            fi
          }

          validate_url ${COMMON_REPO}
          validate_url ${AK3_GIT_URL}

          validate_single_word() {
            if [[ "$1" =~ [[:space:]] ]]; 
              then
                echo "::error::Invalid $2: $1"
                echo "$2 must be a single word without spaces"
                exit 1
            fi
          }

          validate_single_word "${ACK_BRANCH}" \
          "Android-common-kernel branch"

          validate_single_word "${COMMON_REPO_BRANCH}" \
          "Custom Kernel repo branch"

          if [ ! -z "${AK3_GIT_BRANCH}" ]; 
            then 
              validate_single_word "${AK3_GIT_BRANCH}" \
              "AnyKernel3 fork branch"
          fi

          validate_single_word "${IMAGE_TYPE}" \
          "Kernel image type"

      - name: Setup build workspace and a local manifest
        env:
          USE_LATEST_CLANG: ${{ github.event.inputs.use_latest_clang }}
          CUSTOM_MANIFEST: .repo/local_manifests/custom.xml
        run: |
          REPO_SOURCE=$(echo ${COMMON_REPO} | cut -d'/' -f3)
          REPO_OWNER=$(echo ${COMMON_REPO} | cut -d'/' -f4)
          REPO_NAME=$(echo ${COMMON_REPO} | cut -d'/' -f5)

          mkdir kernel-build && cd $_
          mkdir -p .repo/local_manifests

          mecho() {
            echo "$1" >> "${CUSTOM_MANIFEST}"
          }

          mecho '<?xml version="1.0" encoding="UTF-8"?>'
          mecho '<manifest>'
          mecho "  <remote name=\"common-repo\" fetch=\"https://${REPO_SOURCE}/${REPO_OWNER}\" />"
          mecho ''
          mecho '  <remove-project name="kernel/common" />'
          mecho "  <project path=\"common\" name=\"${REPO_NAME}\" remote=\"common-repo\" revision=\"${COMMON_REPO_BRANCH}\" >"
          mecho '    <linkfile src="." dest=".source_date_epoch_dir" />'
          mecho '  </project>'

          if [ "${USE_LATEST_CLANG}" = true ]; then
            mecho '  <remove-project name="platform/prebuilts/clang/host/linux-x86" />'
            mecho '  <project path="prebuilts/clang/host/linux-x86" name="platform/prebuilts/clang/host/linux-x86" revision="main" clone-depth="1" />'
          fi

          mecho '</manifest>'

      - name: Download build utilities
        working-directory: kernel-build
        run: |
          if [ -z "${AK3_GIT_BRANCH}" ]
            then git clone --depth=1 ${AK3_GIT_URL} "${AK3_DIR}"
            else git clone --depth=1 ${AK3_GIT_URL} "${AK3_DIR}" -b ${AK3_GIT_BRANCH}
          fi

          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "${HOME}/.bin" >> ${GITHUB_PATH}

      - name: Clean up container
        uses: rokibhasansagar/slimhub_actions@main

      - name: Initialize the manifest, and sync
        working-directory: kernel-build
        run: |
          repo init \
            --no-tags \
            --depth=1 \
            --dissociate \
            -u https://android.googlesource.com/kernel/manifest \
            -b ${ACK_BRANCH}

          repo sync \
            --no-tags \
            --clone-bundle \
            --current-branch \
            --optimized-fetch \
            --force-sync \
            --fetch-submodules \
            -j$(nproc --all)

      - name: Setup KernelSU Official
        working-directory: kernel-build/common
        run: |
          echo "=== setting up KernelSU official ==="
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          # Verify KSU was set up correctly
          echo "=== KSU setup verification ==="
          ls -la drivers/kernelsu/ 2>/dev/null || echo "WARNING: drivers/kernelsu not found"
          grep -n "kernelsu" drivers/Makefile 2>/dev/null || echo "WARNING: kernelsu not in Makefile"
          grep -n "kernelsu" drivers/Kconfig 2>/dev/null || echo "WARNING: kernelsu not in Kconfig"

      - name: Patch chickernel_defconfig (MANSX KERNEL APEX identity + tuning)
        working-directory: kernel-build/common
        run: |
          { echo ""; echo "POST_DEFCONFIG_CMDS="; } >> build.config.gki.aarch64.chickernel
          echo "=== updating kernel identity to MANSX KERNEL APEX ==="
          sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-MANSX-APEX-V1.0.2-KSU"/' arch/arm64/configs/chickernel_defconfig
          echo "=== applying MANSX KERNEL APEX tuning patch + KSU ==="
          { echo ""; echo "# Tuning: MANSX KERNEL APEX";             echo "CONFIG_NET_SCH_CAKE=y";             echo "CONFIG_NTFS3_FS=y";             echo "CONFIG_NTFS3_LZX_XPRESS=y";             echo "CONFIG_NTFS3_FS_POSIX_ACL=y";             echo "CONFIG_RCU_LAZY=y";             echo "CONFIG_RCU_LAZY_DEFAULT_OFF=n";             echo "CONFIG_TCP_CONG_BBR=y";             echo "CONFIG_DEFAULT_BBR=y";             echo "CONFIG_LRU_GEN=y";             echo "CONFIG_LRU_GEN_ENABLED=y";             echo "CONFIG_MANSX_FLOORS=y";             echo "CONFIG_KSU=y"; }             >> arch/arm64/configs/chickernel_defconfig

          { echo "";             echo "PRE_DEFCONFIG_CMDS="printf '\nCONFIG_NET_SCH_CAKE=y\nCONFIG_NTFS3_FS=y\nCONFIG_NTFS3_LZX_XPRESS=y\nCONFIG_NTFS3_FS_POSIX_ACL=y\nCONFIG_RCU_LAZY_DEFAULT_OFF=n\nCONFIG_TCP_CONG_BBR=y\nCONFIG_DEFAULT_BBR=y\nCONFIG_LRU_GEN=y\nCONFIG_LRU_GEN_ENABLED=y\nCONFIG_MANSX_FLOORS=y\nCONFIG_KSU=y\n' >> arch/arm64/configs/chickernel_defconfig && sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=\"-MANSX-APEX-V1.0.2-KSU\"/' arch/arm64/configs/chickernel_defconfig""; }             >> build.config.gki.aarch64.chickernel
      - name: Disable BTF generation (debug info)
        working-directory: kernel-build/common
        run: |
          echo "CONFIG_DEBUG_INFO_BTF=n" >> arch/arm64/configs/chickernel_defconfig


      - name: Apply MANSX floors patch (Profil B steady - min floor + thermal cap floor)
        working-directory: kernel-build/common
        run: |
          echo "=== applying MANSX floors kernel patch ==="
          printf '%s' '' | base64 -d > /tmp/mansx-floor.diff
          git apply --check /tmp/mansx-floor.diff
          git apply /tmp/mansx-floor.diff
          grep -q MANSX_FLOORS drivers/cpufreq/Kconfig
          grep -q MANSX_CLAMP drivers/cpufreq/cpufreq.c
          grep -q MANSX_FLOORS drivers/thermal/cpufreq_cooling.c
          grep -q mansx_cpufreq_cap_floor include/linux/cpufreq.h
          tail -5 arch/arm64/configs/chickernel_defconfig
          echo "MANSX floors patch applied OK"

      - name: Disable BTF generation
        working-directory: kernel-build/common
        run: |
          echo "=== disable BTF (debug info) ==="
          echo "CONFIG_DEBUG_INFO_BTF=n" >> arch/arm64/configs/chickernel_defconfig
      - name: Build, and process the kernel(s)
        working-directory: kernel-build
        env:
          EXTRA_ARGS: ${{ github.event.inputs.extra_args }}
          FAST_BUILD: ${{ github.event.inputs.fast_build }}
          USE_KLEAF: ${{ github.event.inputs.use_kleaf }}
          OUT_DIR: ${{ github.workspace }}/kernel-build/out
          OUT_BAZEL_DIR: ${{ github.workspace }}/kernel-build/bazel-bin/common
        run: |
          mkdir -p "${FINAL_DIR}"

          for config in ${BUILD_CONFIGS}; do
            echo "Building kernel config ${config+1}: ${config}"
            
            if [ "${USE_KLEAF}" = true ]; 
              then
                if [ "${FAST_BUILD}" = true ]; 
                  then tools/bazel build ${EXTRA_ARGS} --config=fast //common:${config}
                  else tools/bazel build ${EXTRA_ARGS} //common:${config}
                fi

                if [ -f "${OUT_BAZEL_DIR}/${config}/${IMAGE_TYPE}" ]; 
                  then
                    sudo chmod 777 -R ${OUT_BAZEL_DIR}/${config}
                    mv "${OUT_BAZEL_DIR}/${config}/${IMAGE_TYPE}" "${FINAL_DIR}/${IMAGE_TYPE}-${config}"
                  else
                    echo "Error: Output image not found for ${config}"
                    exit 1
                fi
              else
                BUILD_CONFIG=common/${config} ${EXTRA_ARGS} build/build.sh

                if [ -f "${OUT_DIR}/dist/${IMAGE_TYPE}" ]; 
                  then 
                    mv "${OUT_DIR}/dist/${IMAGE_TYPE}" "${FINAL_DIR}/${IMAGE_TYPE}-${config}"
                  else
                    echo "Error: Output image not found for ${config}"
                    exit 1
                fi
            fi
          done

      - name: Verify MANSX KERNEL APEX tuning built into kernel
        working-directory: kernel-build
        run: |
          # Guardrail: fail the build if the tuning symbols did not make it
          # into .config / auto.conf / objects (regression protection).
          grep -E "CONFIG_NET_SCH_CAKE=y" out/common/.config
          grep -E "CONFIG_NTFS3_FS=y" out/common/.config
          grep -E "CONFIG_LRU_GEN=y" out/common/.config
          grep -E "CONFIG_LRU_GEN_ENABLED=y" out/common/.config
          ! grep -E "CONFIG_RCU_LAZY_DEFAULT_OFF=y" out/common/.config
          grep -E "CONFIG_TCP_CONG_BBR=y" out/common/.config
          grep -E "CONFIG_DEFAULT_BBR=y" out/common/.config
          grep -E "CONFIG_DEFAULT_TCP_CONG=\"bbr\"" out/common/.config
          grep -E "CONFIG_LOCALVERSION=\"-MANSX-APEX-V1.0.2-KSU\"" out/common/.config
          grep -E "CONFIG_MANSX_FLOORS=y" out/common/.config
          grep -E "CONFIG_KSU=y" out/common/.config
          grep -E "CONFIG_MANSX_FLOORS=y" out/common/include/config/auto.conf
          test -f out/common/drivers/thermal/cpufreq_cooling.o
          grep -E "CONFIG_NET_SCH_CAKE=y" out/common/include/config/auto.conf
          grep -E "CONFIG_NTFS3_FS=y" out/common/include/config/auto.conf
          test -f out/common/net/sched/sch_cake.o
          test -d out/common/fs/ntfs3
          echo "TUNING OK: CAKE/NTFS3/BBR/MGLRU/RCU-lazy/APEX-identity verified"

      - name: Package Kernels with AnyKernel3
        working-directory: kernel-build
        run: |
          for config in ${BUILD_CONFIGS}; do
            if [ -f "${FINAL_DIR}/${IMAGE_TYPE}-${config}" ]; then
              cp -r "${AK3_DIR}" "${AK3_DIR}-${config}"
              cd "${AK3_DIR}-${config}"
              
              cp "${FINAL_DIR}/${IMAGE_TYPE}-${config}" "${AK3_DIR}-${config}/${IMAGE_TYPE}"
              
              # MANSX KERNEL APEX banner
              cat > banner <<'BANNER'
           __  __    _    _   _ ____  __  __  _  _____ _   _ 
          |  \/  |  / \  | \ | / ___||  \/  |/ \| ____| \ | |
          | |\/| | / _ \ |  \| \___ \| |\/| / _ \  _| |  \| |
          | |  | |/ ___ \| |\  |___) | |  |/ ___ \ |___| |\  |
          |_|  |_/_/   \_\_| \_|____/|_|  /_/   \_\_____|_| \_|
           _____  _____   _____ _______ _     _ _______ 
          |_ _\ \/ /_ _| | ____|_   _| |   | | |_   _|
           | | \  / | |  |  _|   | | | |   | |   | |  
           | | /  \ | |  | |___  | | | |___| |___| |  
          |___/_/\_\___| |_____| |_| |_____|_____|_|  
           ____________ _____  ___________ _   _ 
          /_  __/ ___// ____\ \ / / ____\ \ | | |
           | |  \___ \| |__  \ V /|  _|  \ \| | |
           | |  /___) |___ \ | | | |___  >  > > |
           |_|  |____/_____/ |_| |_____/_/_/|_|

            PERFORMANCE • GAMING • EFFICIENCY
            ---------------------------------
            Developer : MansXDev
            Version   : 1.0.0
            Codename  : APEX
            Base      : Linux 5.15
            Platform  : Snapdragon 685
            Device    : Redmi Note 13 4G NFC
            Build     : Custom
          BANNER
              # AnyKernel3 script identity
              sed -i 's|^kernel.string=.*|kernel.string=MANSX KERNEL APEX v1.0.0 by MansXDev|' anykernel.sh
              zip -r9 "${FINAL_DIR}/MANSX-KERNEL-APEX-V1.0.0-sapphiren.zip" * -x .git README.md *placeholder
              
              cd ..
            fi
          done

      - name: Upload Kernel Packages
        uses: actions/upload-artifact@v4
        with:
          name: kernel-packages
          path: |
            kernel-build/final_images/*.zip
          if-no-files-found: error
          retention-days: 30
